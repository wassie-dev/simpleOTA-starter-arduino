name: Firmware

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:

permissions:
  contents: read

jobs:
  chips:
    name: Select chips
    runs-on: ubuntu-latest
    outputs:
      list: ${{ steps.set.outputs.list }}
    steps:
      - id: set
        env:
          SIMPLEOTA_CHIP: ${{ vars.SIMPLEOTA_CHIP }}
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            chip="${SIMPLEOTA_CHIP:-esp32}"
            if [[ ! "${chip}" =~ ^[a-z0-9]+$ ]]; then
              echo "Unsupported SIMPLEOTA_CHIP '${chip}'." >&2
              exit 1
            fi
            printf 'list=["%s"]\n' "${chip}" >> "${GITHUB_OUTPUT}"
          else
            printf '%s\n' 'list=["esp32","esp32c6"]' >> "${GITHUB_OUTPUT}"
          fi

  firmware:
    name: Build (${{ matrix.chip }})
    needs: chips
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        chip: ${{ fromJSON(needs.chips.outputs.list) }}
    env:
      SIMPLEOTA_API_TOKEN: ${{ secrets.SIMPLEOTA_API_TOKEN }}
      SIMPLEOTA_CHIP: ${{ matrix.chip }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Arduino CLI
        uses: arduino/setup-arduino-cli@81d310742121c928ea9c8bbd407b4217b432ae02 # v2.0.0
        with:
          version: 1.5.1

      - name: Check firmware version
        id: version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          sketch_version="$(sed -n 's/^#define FIRMWARE_VERSION "\(.*\)"$/\1/p' simpleOTA-starter-arduino/simpleOTA-starter-arduino.ino)"
          if [[ -z "${sketch_version}" ]]; then
            echo "FIRMWARE_VERSION was not found in the sketch."
            exit 1
          fi
          if [[ "${tag}" != "${sketch_version}" ]]; then
            echo "Tag ${GITHUB_REF_NAME} does not match FIRMWARE_VERSION ${sketch_version}."
            exit 1
          fi
          echo "label=${sketch_version}" >> "${GITHUB_OUTPUT}"

      - name: Write release secrets
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          SIMPLEOTA_WIFI_SSID: ${{ secrets.SIMPLEOTA_WIFI_SSID }}
          SIMPLEOTA_WIFI_PASSWORD: ${{ secrets.SIMPLEOTA_WIFI_PASSWORD }}
          SIMPLEOTA_DEVICE_TOKEN: ${{ secrets.SIMPLEOTA_DEVICE_TOKEN }}
        run: ./scripts/secrets.sh write

      - name: Compile
        id: compile
        env:
          SIMPLEOTA_RELEASE: ${{ startsWith(github.ref, 'refs/tags/v') }}
        run: ./scripts/build.sh

      - name: Skip rollout when the project token is missing
        if: startsWith(github.ref, 'refs/tags/v') && env.SIMPLEOTA_API_TOKEN == ''
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          ### SimpleOTA upload skipped

          The SIMPLEOTA_API_TOKEN secret is not set. This tag built the firmware and did not upload it or start a rollout.
          EOF

      - name: Skip rollout when the project id is missing
        if: startsWith(github.ref, 'refs/tags/v') && env.SIMPLEOTA_API_TOKEN != '' && vars.SIMPLEOTA_PROJECT_ID == ''
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          ### SimpleOTA upload skipped

          SIMPLEOTA_API_TOKEN is set, but the SIMPLEOTA_PROJECT_ID repository variable is empty. The release action requires both, so nothing was uploaded.
          EOF

      - name: Upload and start rollout
        if: startsWith(github.ref, 'refs/tags/v') && env.SIMPLEOTA_API_TOKEN != '' && vars.SIMPLEOTA_PROJECT_ID != ''
        uses: xanderwasserman/simpleOTA-actions@v1.0.3
        with:
          api-token: ${{ secrets.SIMPLEOTA_API_TOKEN }}
          project-id: ${{ vars.SIMPLEOTA_PROJECT_ID }}
          binary: build/simpleOTA-starter-arduino.ino.bin
          version-label: ${{ steps.version.outputs.label }}
          chip-family: ${{ steps.compile.outputs.chip }}
